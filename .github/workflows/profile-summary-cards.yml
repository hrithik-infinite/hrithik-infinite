name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate
    steps:
      - uses: actions/checkout@v4

      # Generate cards into ./profile-summary-card-output WITHOUT pushing.
      # The action's built-in push sends the whole workspace tree (incl.
      # .github/workflows) which a default GITHUB_TOKEN cannot push to a
      # non-default branch. So we generate only, then publish the folder.
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: "false"

      # The action emits every card for every theme (~200 files), but the
      # README embeds only two tokyonight cards. Delete the rest so the
      # branch stores solely what's used. The publish step force-pushes the
      # folder, so this also wipes any previously-committed bloat.
      - name: Keep only the cards used in the README
        run: |
          cd profile-summary-card-output
          find . -type f \
            ! -path './tokyonight/0-profile-details.svg' \
            ! -path './tokyonight/3-stats.svg' \
            -delete
          find . -type d -empty -delete

      # Force-publish ONLY the generated folder's contents to the branch
      # (clean tree, no .github) — same pattern the snake workflow uses.
      - name: Publish cards to profile-summary-cards branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: profile-summary-cards
          build_dir: profile-summary-card-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
